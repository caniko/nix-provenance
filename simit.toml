[ci]
provider = "actions"
platform = "github"
runtime = "nix"
runner = "ubuntu-24.04"
publish_crates = true
all_features = false
nix_builds = [
  ".#packages.x86_64-linux.tuwunel-provision",
  ".#checks.x86_64-linux.tuwunel-provision-test",
  ".#checks.x86_64-linux.tuwunel-provision-clippy",
  ".#checks.x86_64-linux.tuwunel-module-eval",
  ".#checks.x86_64-linux.tuwunel-private-rooms-vmtest",
  ".#packages.x86_64-linux.proton-vpn-auth",
  ".#checks.x86_64-linux.proton-vpn-auth-test",
  ".#checks.x86_64-linux.proton-vpn-auth-clippy",
  ".#checks.x86_64-linux.proton-vpn-module-eval",
  ".#packages.x86_64-linux.provenance-rbw",
  ".#checks.x86_64-linux.rbw-test",
  ".#checks.x86_64-linux.rbw-clippy",
  ".#checks.x86_64-linux.rbw-home-module-eval",
  ".#checks.x86_64-linux.stalwart016-proxy-eval",
  ".#checks.x86_64-linux.stalwart016-proxy-vmtest",
]
workspace = true
# Validate PR heads once (pull_request); push runs cover the default branch
# and the simit updater's candidate branches.
push_branches = ["trunk", "simit/update/**"]

[ci.nix_build]
kvm = true
capture_results = true
timeout_minutes = 90
max_parallel = 1
max_jobs = 1
cores = 2
artifact_retention_days = 14
push_branches = ["trunk", "simit/update/**"]

# Each crate has its own cargoArtifacts, so a family shares them in one job.
[ci.nix_build.groups]
tuwunel = [
  ".#packages.x86_64-linux.tuwunel-provision",
  ".#checks.x86_64-linux.tuwunel-provision-test",
  ".#checks.x86_64-linux.tuwunel-provision-clippy",
  ".#checks.x86_64-linux.tuwunel-module-eval",
  ".#checks.x86_64-linux.tuwunel-private-rooms-vmtest",
]
clients = [
  ".#packages.x86_64-linux.proton-vpn-auth",
  ".#checks.x86_64-linux.proton-vpn-auth-test",
  ".#checks.x86_64-linux.proton-vpn-auth-clippy",
  ".#checks.x86_64-linux.proton-vpn-module-eval",
  ".#packages.x86_64-linux.provenance-rbw",
  ".#checks.x86_64-linux.rbw-test",
  ".#checks.x86_64-linux.rbw-clippy",
  ".#checks.x86_64-linux.rbw-home-module-eval",
]
stalwart = [
  ".#checks.x86_64-linux.stalwart016-proxy-eval",
  ".#checks.x86_64-linux.stalwart016-proxy-vmtest",
]

[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"
# Publish only the x86_64-linux packages Canix consumes.
push_branches = ["trunk", "simit/update/**"]
nix_builds = [
  ".#packages.x86_64-linux.forgejo-cli-nushell-completion",
  ".#packages.x86_64-linux.forgejo-provision",
  ".#packages.x86_64-linux.identity-cli",
  ".#packages.x86_64-linux.immich-provision",
  ".#packages.x86_64-linux.kanidm-state-render",
  ".#packages.x86_64-linux.proton-vpn-auth",
  ".#packages.x86_64-linux.provenance-oauth",
  ".#packages.x86_64-linux.provenance-rbw",
  ".#packages.x86_64-linux.rauthy-state-render",
  ".#packages.x86_64-linux.stalwart-oauth-bootstrap",
  ".#packages.x86_64-linux.tuwunel-provision",
]

[prebuild.system_runners]
"x86_64-linux" = "ubuntu-24.04"

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "nix-provenance"
token_secret = "ATTIC_TOKEN"

[ci.pages]
repo = "caniko/nix-provenance"
token_secret = "CODEBERG_TOKEN"
