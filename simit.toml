[ci]
provider = "actions"
platform = "github"
runtime = "nix"
runner = "ubuntu-24.04"
publish_crates = true
all_features = false
nix_builds = [
  ".#packages.x86_64-linux.tuwunel-provision",
  ".#checks.x86_64-linux.tuwunel-provision-test",
  ".#checks.x86_64-linux.tuwunel-provision-clippy",
  ".#checks.x86_64-linux.tuwunel-module-eval",
  ".#checks.x86_64-linux.tuwunel-private-rooms-vmtest",
  ".#packages.x86_64-linux.proton-vpn-auth",
  ".#checks.x86_64-linux.proton-vpn-auth-test",
  ".#checks.x86_64-linux.proton-vpn-auth-clippy",
  ".#checks.x86_64-linux.proton-vpn-module-eval",
  ".#packages.x86_64-linux.provenance-rbw",
  ".#checks.x86_64-linux.rbw-test",
  ".#checks.x86_64-linux.rbw-clippy",
  ".#checks.x86_64-linux.rbw-home-module-eval",
  ".#checks.x86_64-linux.stalwart016-proxy-eval",
  ".#checks.x86_64-linux.stalwart016-proxy-vmtest",
]
workspace = true

[ci.nix_build]
kvm = true
capture_results = true
timeout_minutes = 90
max_parallel = 1
max_jobs = 1
cores = 2
artifact_retention_days = 14

[ci.pages]
repo = "caniko/nix-provenance"
token_secret = "CODEBERG_TOKEN"
