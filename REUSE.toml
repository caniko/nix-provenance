version = 1

# REUSE 3.0 per-path SPDX. When a path matches multiple annotations, the LAST
# matching annotation wins — so origin-specific blocks precede the catch-all.

[[annotations]]
path = "crates/immich-provision/**"
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["nix/lib/immich.nix", "nix/modules/service-oidc/immich.nix", "nix/modules/test/immich-eval.nix", "docs/rfcs/**", "docs/kanidm-oidc-migration.md"]
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["nix/lib/vikunja.nix", "nix/modules/config-only/vikunja.nix", "nix/modules/test/vikunja-eval.nix"]
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["nix/lib/forgejo.nix", "nix/modules/service-oidc/forgejo.nix", "nix/modules/test/forgejo-eval.nix"]
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = "crates/rauthy-provision/**"
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["nix/lib/rauthy.nix", "nix/modules/idp/rauthy.nix"]
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Catch-all for new, shared, permissive files. Listed LAST so docs/architecture.md
# overrides the AGPL docs/** rule above.
[[annotations]]
path = ["flake.nix", "flake.lock", "Cargo.toml", "Cargo.lock", "README.md", "LICENSING.md", "REUSE.toml", ".gitignore", "nix/lib/default.nix", "nix/packages.nix", "nix/checks.nix", "crates/provenance-core/**", "docs/architecture.md", ".forgejo/**"]
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "MIT OR Apache-2.0"
