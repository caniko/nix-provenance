version = 1

# REUSE 3.0 per-path SPDX. When a path matches multiple annotations, the LAST
# matching annotation wins — so origin-specific blocks precede the catch-all.

[[annotations]]
path = "crates/immich-provision/**"
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = "crates/identity-cli/**"
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "MPL-2.0"

[[annotations]]
path = ["nix/lib/immich.nix", "nix/modules/service-oidc/immich.nix", "nix/modules/test/immich-eval.nix", "docs/kanidm-oidc-migration.md"]
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["docs/src/guides/kanidm-oidc-migration.md", "docs/src/rfcs/**"]
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["nix/lib/vikunja.nix", "nix/modules/config-only/vikunja.nix", "nix/modules/test/vikunja-eval.nix"]
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["crates/vikunja-provision/**", "nix/modules/service-oidc/vikunja.nix", "nix/modules/test/vikunja-provision-eval.nix"]
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["nix/lib/forgejo.nix", "nix/modules/service-oidc/forgejo.nix", "nix/modules/test/forgejo-eval.nix"]
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = ["nix/lib/stalwart.nix", "nix/modules/ldap/stalwart.nix", "nix/modules/test/stalwart-eval.nix"]
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Third-party identity adapter — pure-Nix wiring over the rauthy/kanidm
# provisioners, so permissive (no AGPL crate involved).
[[annotations]]
path = ["nix/lib/adapter.nix", "nix/modules/adapter/external-app.nix", "nix/modules/test/adapter-eval.nix", "docs/adapter-external-apps.md"]
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = "crates/rauthy-provision/**"
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["nix/lib/rauthy.nix", "nix/modules/idp/rauthy.nix", "nix/modules/test/rauthy-eval.nix"]
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Catch-all for new, shared, permissive files. Listed LAST so docs/architecture.md
# overrides the AGPL docs/** rule above.
[[annotations]]
path = ["flake.nix", "flake.lock", "Cargo.toml", "Cargo.lock", "README.md", "LICENSING.md", "REUSE.toml", ".gitignore", "nix/lib/default.nix", "nix/lib/passwords.nix", "nix/packages.nix", "nix/checks.nix", "nix/modules/config-only/.gitkeep", "nix/modules/ldap/.gitkeep", "crates/provenance-core/**", "docs/book.toml", "docs/architecture.md", "docs/planning/**", "docs/src/SUMMARY.md", "docs/src/introduction.md", "docs/src/getting-started/development.md", "docs/src/concepts/architecture.md", "docs/src/guides/external-apps.md", "docs/src/reference/licensing.md", ".forgejo/**"]
SPDX-FileCopyrightText = "Can H. Tartanoglu"
SPDX-License-Identifier = "MIT OR Apache-2.0"
