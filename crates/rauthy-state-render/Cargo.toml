[package]
name = "rauthy-state-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Offline generic renderer for rauthy-provision state JSON"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage = "https://github.com/caniko/nix-provenance"
authors.workspace = true
keywords = ["rauthy", "oidc", "provisioning", "renderer"]
categories = ["command-line-utilities"]

[[bin]]
name = "rauthy-state-render"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
rauthy-provision = { path = "../rauthy-provision" }
serde.workspace = true
serde_json.workspace = true

[lints.clippy]
all = { level = "warn", priority = -1 }
