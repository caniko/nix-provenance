[package]
name = "identity-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
description = "Identity administration CLI for Kanidm and Bitwarden-backed provisioning"
repository.workspace = true
authors.workspace = true
keywords = ["kanidm", "bitwarden", "identity", "2fa"]
categories = ["command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "identity-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
rand = "0.9"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
base64 = { version = "0.22", optional = true }

# Kanidm's 1.10.3 source has workspace package version 1.10.3 and resolves
# kanidm_client/kanidm_proto to =1.10.3, but crates.io currently publishes only
# 1.10.0 for both crates. Verified against the nixpkgs kanidm 1.10.3 source at
# /nix/store/akp98h1lkc1icbq78rvkmsp9ndjd345g-source and the v1.10.3 git tag.
kanidm_client = { git = "https://github.com/kanidm/kanidm.git", tag = "v1.10.3", package = "kanidm_client", optional = true }
kanidm_proto = { git = "https://github.com/kanidm/kanidm.git", tag = "v1.10.3", package = "kanidm_proto", optional = true }
totp-rs = { version = "5", optional = true }

# Rauthy reset-password helpers. async reqwest with rustls (no openssl C dep, so
# it cross-compiles to aarch64 like rauthy-provision); TLS feature kept LOCAL —
# do not hoist into [workspace.dependencies]. spow solves Rauthy's request_reset
# Proof-of-Work (server feature = the native solver), matching rauthy-provision.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls-native-roots",
], optional = true }
spow = { version = "0.6", default-features = false, features = ["server"], optional = true }

[features]
default = ["kanidm", "bitwarden", "rauthy"]
kanidm = ["dep:kanidm_client", "dep:kanidm_proto", "dep:totp-rs"]
bitwarden = ["dep:base64"]
rauthy = ["dep:reqwest", "dep:spow"]

[lints.clippy]
all = { level = "warn", priority = -1 }
