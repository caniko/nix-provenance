[package]
name = "provenance-oauth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "Host-scoped OAuth enrollment and shared access credentials"

[dependencies]
age = { version = "0.11", features = ["ssh", "plugin"] }
anyhow.workspace = true
base64 = "0.22"
clap.workspace = true
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile = "3"
zeroize.workspace = true

[lints.clippy]
all = { level = "warn", priority = -1 }
