[package]
name = "rauthy-provision"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Declarative provisioning client for Rauthy (users, groups, roles, OIDC clients) — a kanidm-provision analogue"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/caniko/rauthy-provision"
homepage = "https://codeberg.org/caniko/rauthy-provision"
authors = ["Can H. Tartanoglu <gpg@rotas.mozmail.com>"]
keywords = ["rauthy", "oidc", "provisioning", "iam"]
categories = ["command-line-utilities"]

[[bin]]
name = "rauthy-provision"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
# Mirror kanidm-provision's TLS choice: rustls, no openssl C dependency, so the
# crate cross-compiles / emulates cleanly for aarch64 (thething's RockPro64).
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls-native-roots",
  "blocking",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"

[lints.clippy]
all = { level = "warn", priority = -1 }
