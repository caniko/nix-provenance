[package]
name = "vikunja-provision"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Declarative provisioning client for Vikunja teams and memberships"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage = "https://github.com/caniko/nix-provenance"
authors.workspace = true
keywords = ["vikunja", "provisioning", "teams", "iam"]
categories = ["command-line-utilities"]

[[bin]]
name = "vikunja-provision"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
provenance-core = { path = "../provenance-core" }
# TLS features kept LOCAL -- do not hoist into [workspace.dependencies] (see
# root Cargo.toml). Vikunja is an external HTTPS service; use rustls with native
# roots and no openssl dependency so aarch64 builds stay clean.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls-native-roots",
  "blocking",
] }
serde.workspace = true
serde_json.workspace = true

[lints.clippy]
all = { level = "warn", priority = -1 }
