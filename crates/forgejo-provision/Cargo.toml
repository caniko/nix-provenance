[package]
name = "forgejo-provision"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Declarative Forgejo SSH public-key provisioning"
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage = "https://codeberg.org/caniko/nix-provenance"
authors.workspace = true
keywords = ["forgejo", "ssh", "provisioning", "identity"]
categories = ["command-line-utilities"]

[[bin]]
name = "forgejo-provision"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
provenance-core = { path = "../provenance-core" }
# Keep the TLS feature local. Forgejo normally uses a loopback HTTP endpoint,
# but native roots make the same binary safe for an explicitly configured HTTPS
# endpoint without linking openssl.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls-native-roots",
  "blocking",
] }
serde.workspace = true
serde_json.workspace = true

[lints.clippy]
all = { level = "warn", priority = -1 }
