[workspace]
resolver = "2"
members = [
  "crates/provenance-core",
  "crates/immich-provision",
  "crates/kanidm-state-render",
  "crates/rauthy-provision",
  "crates/rauthy-state-render",
  "crates/vikunja-provision",
  "crates/forgejo-provision",
  "crates/identity-cli",
  "crates/stalwart016-provision",
  "crates/stalwart-oauth-bootstrap",
  "crates/tuwunel-provision",
]

# Shared package metadata. `version` is intentionally NOT inherited — each crate
# versions and tags independently (immich-provision-vX / rauthy-provision-vX).
[workspace.package]
edition = "2024"
rust-version = "1.95"
repository = "https://codeberg.org/caniko/nix-provenance"
authors = ["Can H. Tartanoglu <gpg@rotas.mozmail.com>"]

# Only license-agnostic, feature-stable dependencies are hoisted here. reqwest is
# deliberately ABSENT: immich uses `rustls-tls` and rauthy uses
# `rustls-tls-native-roots`, and a single workspace lock would UNION those TLS
# features (silently changing rauthy's root of trust). spow stays rauthy-local
# (immich must never link it). Keep reqwest/spow in the member manifests.
[workspace.dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

# Cargo applies [profile.*] from the workspace ROOT manifest only; member-level
# profiles are IGNORED. rauthy's former crate-level strip+thin-LTO lives here now
# and now also applies to immich (an improvement, not a regression).
[profile.release]
strip = true
lto = "thin"
