name: ci

on:
  push:
    branches: [trunk]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    # Bare atlas image (node + git); nix is installed in-job for a read-only
    # `nix flake check` against the canix Attic (anonymous reads, no token).
    # This single check covers every gate: per-crate build/clippy/test+nextest,
    # rustfmt, alejandra, both module-evals, immich-patch-applies, the
    # tls-feature-isolation and license-firewall guards, and rauthy-binary-stripped.
    runs-on: atlas
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://github.com/cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://attic.candee.baby/canix https://cache.nixos.org
            trusted-public-keys = canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
      - run: nix flake check --keep-going --print-build-logs
